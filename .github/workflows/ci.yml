name: test

# Caustic is not on any package index, so CI installs the toolchain the way a
# person does: the published Linux release, unpacked, on PATH.
#
# The second step exists because the released caustic-mk predates the fix that
# lets a `depend` be imported under the name it was declared with. Delete it
# once a release ships that; nothing else here depends on building from source.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Caustic toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Caua726/Caustic \
            --pattern 'caustic-x86_64-linux.tar.gz' --output caustic.tar.gz
          tar xzf caustic.tar.gz
          echo "$PWD/caustic-x86_64-linux/bin" >> "$GITHUB_PATH"

      - name: Build a current caustic-mk
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/Caua726/Caustic "$RUNNER_TEMP/caustic-src"
          ( cd "$RUNNER_TEMP/caustic-src" && caustic-mk build caustic-mk )
          cp "$RUNNER_TEMP/caustic-src/caustic-mk" \
             "$GITHUB_WORKSPACE/caustic-x86_64-linux/bin/caustic-mk"

      - name: Test
        run: caustic-mk run test
