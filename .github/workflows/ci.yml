name: test

# Caustic is not on any package index, so CI installs the toolchain the way a
# person does: the published Linux release, unpacked, on PATH.
#
# This used to build caustic-mk from source as well, because the released one
# passed only the per-dependency `--path` and not the deps root, so a module
# could not be imported under the name it was declared with. v0.1.6 ships the
# fix, and the suite is green on the release alone, so the extra step is gone.
#
# `caustic-mk build run` clones the `depend` entries into .caustic/deps before
# compiling, so the crypto dependency needs no step of its own here — but it
# does mean this job needs network and git, and a checkout is always cold.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Caustic toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Caua726/Caustic \
            --pattern 'caustic-x86_64-linux.tar.gz' --output caustic.tar.gz
          tar xzf caustic.tar.gz
          echo "$PWD/caustic-x86_64-linux/bin" >> "$GITHUB_PATH"

      - name: Test
        run: caustic-mk run test

      # The optimizing backends are a second and third code generator, not
      # flags: they have regressed the same source before. The Causticfile
      # offers them, so CI has to be the thing that keeps the offer true.
      #
      # -O2 is here because it was never run over this suite until it was, and
      # a level nobody runs is how the -O1 thread miscompile survived: the
      # inliner is an -O1-only pass and every test passed at the level the
      # suite happened to use.
      - name: Test (-O1)
        run: OPT=-O1 caustic-mk run test-opt

      - name: Test (-O2)
        run: OPT=-O2 caustic-mk run test-opt
